name: Android APK

# Builds an installable Android APK from the Expo project.
# - Pull requests: build and attach the APK to the run (for checking).
# - main: also publish it as a GitHub Release. The newest APK is always at
#   https://github.com/Husn1ddin7777/Rahmat-app/releases/latest/download/Rahmat.apk

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # only used by the release step on main
    defaults:
      run:
        shell: bash
    env:
      # Each build gets a higher version code, so Android installs it as an update.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Recordings uploaded to assets/audio are linked here, so adding one on GitHub is enough.
      - name: Link adhkar recordings
        run: node scripts/audio-sync.cjs

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Set Android version code
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Real phones only (ARM); skipping emulator ABIs halves build time and size.
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report Gradle errors
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || exit 0
          summary=$( { sed -n '/What went wrong/,/\* Try:/p' "$log"; grep -E '(^e: |error:|ERROR:)' "$log" | tail -n 15; } | head -c 6000 )
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\r'/}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::${summary}"

      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          badging=$("$tools/aapt2" dump badging "$apk")
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          echo "$badging" | grep -E "^package:|sdkVersion|native-code"
          echo "$certs"
          mkdir -p out
          cp "$apk" out/Rahmat.apk
          package=$(echo "$badging" | grep -m1 '^package:')
          digest=$(echo "$certs" | grep -m1 'SHA-256 digest')
          echo "::notice title=APK ready::${package} | ${digest} | $(du -h out/Rahmat.apk | cut -f1)"

      - uses: actions/upload-artifact@v7
        with:
          name: Rahmat-android-build-${{ github.run_number }}
          path: out/Rahmat.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          tag="android-v${version}-build.${VERSION_CODE}"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Rahmat — Android uchun o‘rnatish fayli.

          **O‘rnatish:** telefoningizda `Rahmat.apk` faylini yuklab oling va oching. Telefon ruxsat so‘rasa, shu manbadan ilova o‘rnatishga ruxsat bering.

          Avvalgi versiya o‘rnatilgan bo‘lsa, ilova ma’lumotlaringiz saqlangan holda yangilanadi.
          NOTES
          gh release create "$tag" out/Rahmat.apk \
            --title "Rahmat Android ${version} (build ${VERSION_CODE})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest
